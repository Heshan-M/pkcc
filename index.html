<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T2C</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Hidden text trick: text color matches background until highlighted */
        .secret-hidden-text {
            color: #ffffff;
            background-color: #ffffff;
            user-select: text;
        }
        .secret-hidden-text::selection {
            color: #0f766e; /* teal text on highlight */
            background-color: #ccfbf1;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="w-full max-w-sm">
        <div class="bg-white p-8 rounded-xl shadow-md border border-slate-200">
            <h2 class="text-2xl font-bold text-center mb-6 text-slate-700">Log In</h2>
            <div id="loginError" class="hidden mb-4 p-3 bg-red-50 text-red-600 text-sm rounded text-center font-medium">
                Invalid Username or Password
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Username</label>
                    <input type="text" id="usernameInput" onkeydown="handleUserKey(event)" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Password</label>
                    <input type="password" id="passwordInput" onkeydown="handlePassKey(event)" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm">
                </div>
                <button onclick="handleLogin()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-medium py-2.5 rounded-lg transition duration-200">
                    Login
                </button>
            </div>
        </div>
        <!-- FOOTER BELOW LOGIN FORM -->
        <div class="mt-4 text-center text-xs text-slate-400">
            Copyright © hM
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="appScreen" class="hidden w-full max-w-2xl">
        <div class="bg-white p-6 md:p-8 rounded-xl shadow-md border border-slate-200">
            
            <div class="flex justify-between items-center mb-6 border-b border-slate-100 pb-4">
                <h1 class="text-xl font-bold text-slate-700">T2C</h1>
                <button onclick="handleLogout()" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold rounded-lg transition">
                    Logout
                </button>
            </div>

            <!-- Mode Selector Tabs -->
            <div class="flex mb-6 bg-slate-100 p-1 rounded-lg">
                <button id="tabEncrypt" onclick="switchTab('encrypt')" class="flex-1 py-2 text-sm font-medium rounded-md bg-white shadow-sm text-teal-700 transition">Encrypt Message</button>
                <button id="tabDecrypt" onclick="switchTab('decrypt')" class="flex-1 py-2 text-sm font-medium rounded-md text-slate-600 transition">Decrypt Message</button>
            </div>

            <!-- ENCRYPT SECTION -->
            <div id="sectionEncrypt" class="space-y-4">
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-sm font-medium text-slate-600">Type Your Message (Singlish / Text)</label>
                        <button onclick="clearInput('encryptInput')" class="text-xs text-rose-600 hover:underline font-medium">Clear</button>
                    </div>
                    <input type="text" id="encryptInput" oninput="doEncrypt()" placeholder="Type single line here (e.g. mama yanawa)..." class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-sm font-medium text-slate-600">Encrypted Output (Send this to friend)</label>
                        <button onclick="copyToClipboard('encryptOutput')" class="text-xs text-teal-600 hover:underline font-medium">Copy</button>
                    </div>
                    <div class="relative">
                        <div id="encryptOutput" class="w-full min-h-[46px] p-3 bg-slate-50 border border-slate-200 rounded-lg font-mono text-slate-700 text-sm break-all flex items-center"></div>
                    </div>
                </div>
            </div>

            <!-- DECRYPT SECTION -->
            <div id="sectionDecrypt" class="space-y-4 hidden">
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-sm font-medium text-slate-600">Paste Encrypted Code Here</label>
                        <button onclick="clearInput('decryptInput')" class="text-xs text-rose-600 hover:underline font-medium">Clear</button>
                    </div>
                    <input type="text" id="decryptInput" oninput="doDecrypt()" placeholder="Paste code here..." class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm font-mono">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-sm font-medium text-slate-600">Hidden Decrypted Text (Highlight with mouse to read)</label>
                        <button onclick="clearInput('decryptOutput')" class="text-xs text-rose-600 hover:underline font-medium">Clear</button>
                    </div>
                    <div class="w-full min-h-[46px] p-3 bg-white border border-slate-200 rounded-lg text-sm flex items-center">
                        <span id="decryptOutput" class="secret-hidden-text font-medium select-all"></span>
                    </div>
                </div>
            </div>

        </div>
        <!-- FOOTER BELOW APP CARD -->
        <div class="mt-4 text-center text-xs text-slate-400">
            Copyright © hM
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Keyboard event for Username field (Press Enter -> focus Password)
        function handleUserKey(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                document.getElementById('passwordInput').focus();
            }
        }

        // Keyboard event for Password field (Press Enter -> Login)
        function handlePassKey(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                handleLogin();
            }
        }

        // Simple Login Handler
        function handleLogin() {
            const user = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();
            const errorBox = document.getElementById('loginError');

            if ((user === 'Hello' || user === 'hello') && pass === 'grahambell') {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appScreen').classList.remove('hidden');
                errorBox.classList.add('hidden');
            } else {
                errorBox.classList.remove('hidden');
            }
        }

        function handleLogout() {
            document.getElementById('usernameInput').value = '';
            document.getElementById('passwordInput').value = '';
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('appScreen').classList.add('hidden');
        }

        // Tab Switching
        function switchTab(tab) {
            const encTab = document.getElementById('tabEncrypt');
            const decTab = document.getElementById('tabDecrypt');
            const encSec = document.getElementById('sectionEncrypt');
            const decSec = document.getElementById('sectionDecrypt');

            if (tab === 'encrypt') {
                encTab.className = "flex-1 py-2 text-sm font-medium rounded-md bg-white shadow-sm text-teal-700 transition";
                decTab.className = "flex-1 py-2 text-sm font-medium rounded-md text-slate-600 transition";
                encSec.classList.remove('hidden');
                decSec.classList.add('hidden');
            } else {
                decTab.className = "flex-1 py-2 text-sm font-medium rounded-md bg-white shadow-sm text-teal-700 transition";
                encTab.className = "flex-1 py-2 text-sm font-medium rounded-md text-slate-600 transition";
                decSec.classList.remove('hidden');
                encSec.classList.add('hidden');
            }
        }

        // Custom Symmetric Encryption / Decryption Cipher
        function encryptText(text) {
            if (!text) return '';
            try {
                return btoa(encodeURIComponent(text)).split('').reverse().join('');
            } catch (e) {
                return '';
            }
        }

        function decryptText(code) {
            if (!code) return '';
            try {
                let reversed = code.split('').reverse().join('');
                return decodeURIComponent(atob(reversed));
            } catch (e) {
                return 'Invalid Secret Code';
            }
        }

        function doEncrypt() {
            let val = document.getElementById('encryptInput').value;
            let encrypted = encryptText(val);
            document.getElementById('encryptOutput').innerText = encrypted;
        }

        function doDecrypt() {
            let val = document.getElementById('decryptInput').value.trim();
            let decrypted = decryptText(val);
            document.getElementById('decryptOutput').innerText = decrypted;
        }

        function clearInput(elementId) {
            let el = document.getElementById(elementId);
            if (el.tagName === 'INPUT') {
                el.value = '';
            } else {
                el.innerText = '';
            }
            if (elementId === 'encryptInput') doEncrypt();
            if (elementId === 'decryptInput') doDecrypt();
        }

        function copyToClipboard(elementId) {
            let text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text);
        }
    </script>
</body>
</html>
